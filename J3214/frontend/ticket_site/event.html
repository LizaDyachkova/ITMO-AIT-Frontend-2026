<!--вкладки мероприятий-->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мероприятие — MakaChakaTickets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">MakaChakaTickets</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Мероприятия</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Войти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row">
    <div class="col-md-6">
      <img id="ev-img" src="" class="img-fluid rounded" alt="">
    </div>
    <div class="col-md-6">
      <h1 id="ev-title" class="display-6"></h1>
      <p id="ev-date" class="text-muted"></p>
      <p id="ev-place" class="text-muted"></p>
      <h3 id="ev-price" class="mt-4"></h3>

      <button class="btn btn-primary btn-lg mt-2" data-bs-toggle="modal" data-bs-target="#buyModal"> Купить билет</button>
    </div>
  </div>
</div>

<div class="modal fade" id="buyModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modal-ev-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label for="qty" class="form-label">Количество билетов</label>
        <input type="number" id="qty" class="form-control" value="1" min="1" max="10">
        <p class="mt-3">Итого: <strong id="modal-total"></strong> ₽</p>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" id="confirm-buy" class="btn btn-primary">Подтвердить покупку</button>
      </div>

    </div>
  </div>
</div>
    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/events-data.js"></script>
<script src="js/event-detail.js"></script>
</body>
</html>
