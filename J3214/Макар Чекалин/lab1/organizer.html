<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет организатора — MakaChakaTickets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">MakaChakaTickets</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Мероприятия</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Мои билеты</a></li>
        <li class="nav-item"><a class="nav-link" href="organizer.html">Организатору</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="display-6 mb-0">Мои мероприятия</h1>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
      + Добавить мероприятие
    </button>
  </div>

  <table class="table table-bordered align-middle">
    <thead>
      <tr>
        <th>Название</th>
        <th>Дата</th>
        <th>Город</th>
        <th>Цена</th>
      </tr>
    </thead>
    <tbody id="organizer-body"></tbody>
  </table>
</div>

<!-- Модалка создания мероприятия -->
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Новое мероприятие</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="create-form">
          <div class="mb-3">
            <label for="new-title" class="form-label">Название</label>
            <input type="text" class="form-control" id="new-title" required>
          </div>
          <div class="mb-3">
            <label for="new-date" class="form-label">Дата</label>
            <input type="text" class="form-control" id="new-date" placeholder="например, 5 ноября" required>
          </div>
          <div class="mb-3">
            <label for="new-city" class="form-label">Город</label>
            <input type="text" class="form-control" id="new-city" required>
          </div>
          <div class="mb-3">
            <label for="new-price" class="form-label">Цена, ₽</label>
            <input type="number" class="form-control" id="new-price" min="0" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Создать</button>
        </form>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/events-data.js"></script>
<script src="js/organizer.js"></script>
</body>
</html>
