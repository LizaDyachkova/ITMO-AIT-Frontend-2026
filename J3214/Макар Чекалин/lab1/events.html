<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мероприятия — MakaChakaTickets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">MakaChakaTickets</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
        <li class="nav-item"><a class="nav-link" href="events.html">Мероприятия</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Войти</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="display-6 mb-4">Все мероприятия</h1>

  <div class="row">
    <!-- Панель фильтров слева -->
    <div class="col-md-3 mb-4">
      <div class="p-3 border rounded">
        <label for="f-type" class="form-label">Тип</label>

        <select id="f-type" class="form-select mb-3"> <!-- Тут у нас выпадаюшее менб-->
          <option value="all">Все типы</option>
          <option value="standup">Стендап</option>
          <option value="workshop">Мастер-класс</option>
          <option value="sport">Спорт</option>
        </select>

        <label for="f-city" class="form-label">Город</label>
        <select id="f-city" class="form-select mb-3">
          <option value="all">Все города</option>
          <option value="Санкт-Петербург">Санкт-Петербург</option>
          <option value="Москва">Москва</option>
        </select>

        <button id="f-reset" class="btn btn-outline-secondary w-100">Сбросить</button>
      </div>
    </div>

    <!-- Сетка мероприятий справа -->
    <div class="col-md-9">
      <div class="row" id="events-grid"></div>
    </div>
  </div>
</div>

<script src="js/events-data.js"></script>
<script src="js/main.js"></script>
<script src="js/events.js"></script>
</body>
</html>
