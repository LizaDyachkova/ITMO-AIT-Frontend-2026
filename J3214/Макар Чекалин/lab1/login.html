<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — MakaChakaTickets</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="container" style="max-width: 400px; margin-top: 80px;">
    <h1 class="display-6 text-center mb-4">Вход</h1>

    <form id="login-form">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label> <!-- Что бы нас при нажатии на войти отправляло на email-->
        <input type="email" class="form-control" id="email" required> <!-- Ну он обязателен еще с помощью required-->
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
  </div>

<script src="js/auth.js"></script> <!-- тут логика авторизации-->
</body>
</html>
